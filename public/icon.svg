<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="100" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Golden Sun of Africa -->
  <circle cx="256" cy="220" r="110" fill="url(#gold)" opacity="0.9"/>
  <circle cx="256" cy="220" r="140" fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="10 14" opacity="0.6"/>

  <!-- Sacred Baobab Tree Silhouette -->
  <g fill="#1c1917">
    <!-- Trunk and heavy roots -->
    <path d="M226 270 C226 230 240 200 256 190 C272 200 286 230 286 270 C290 320 320 370 370 410 C320 410 280 395 256 360 C232 395 192 410 142 410 C192 370 222 320 226 270 Z"/>
    <!-- Canopy -->
    <circle cx="256" cy="150" r="60"/>
    <circle cx="200" cy="170" r="50"/>
    <circle cx="312" cy="170" r="50"/>
    <circle cx="160" cy="205" r="35"/>
    <circle cx="352" cy="205" r="35"/>
  </g>

  <!-- Crown / Cowrie Accent -->
  <ellipse cx="256" cy="390" rx="36" ry="16" fill="url(#gold)"/>
  <path d="M236 390 Q256 384 276 390" stroke="#78350f" stroke-width="3" fill="none"/>

  <!-- Title Ribbon Text Graphic -->
  <text x="256" y="460" font-family="'Cinzel', serif" font-size="28" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="4">RAÍZES</text>
  <text x="256" y="488" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#a8a29e" text-anchor="middle" letter-spacing="6">DA LIBERDADE</text>
</svg>
